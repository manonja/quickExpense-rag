    title: Other income
    content: 'On line 8230, enter the total income you received from other sources.
      Some examples of other income are:


      a recovered amount you wrote off as a bad debt in a previous year

      the value of prizes or vacation trips awarded to you because of your business
      or professional activities

      payments you received for land you leased for petroleum or natural gas exploration.
      For more information, see Interpretation Bulletin IT-200, Surface Rentals and
      Farming Operations

      grants, subsidies, incentives, or assistance you get from a government, government
      agency or non-government agency. Input tax credits are considered government
      assistance. Include the amount you claimed on line 108 of your GST/HST return
      only if you cannot apply the rebate, grant or assistance you received to reduce
      a particular expense or an asset''s capital cost. For more information, see Grants,
      subsidies and rebates

      If you use the quick method to calculate your GST/HST remittances, report the
      1% credit (maximum $300) that you claimed on line 108 of your GST/HST return
      (or on line 107 if you filed on paper). For more information, see Interpretation
      Bulletin IT-273, Government Assistance – General Comments.'
    applies_to: []
