    title: Interest and bank charges
    content: 'You can deduct interest on money borrowed for business purposes or to
      acquire property for business purposes. This includes fishing businesses.


      There are limits on:


      The interest you can deduct on money you borrow to buy a passenger vehicle or
      a zero-emission passengervehicle (ZEPV). For more information, seeLine 9281
      –Motor vehicle expenses (not including CCA)The amount of interest you can deduct
      for vacant land. Usually, you can only deduct interest up to the amount of income
      from the land that remains after you deduct all other expenses. You cannot use
      any remaining amounts of interest to create or increase a loss, and you cannot
      deduct them from other sources of incomeThe interest you paid on any real estate
      mortgage you had to earn fishing income. You can deduct the interest, but you
      cannot deduct the principal part of loan or mortgage payments. Do not deduct
      interest on money you borrowed for personal purposes or to pay overdue income
      taxes


      You can deduct the fee you pay to reduce the interest rate on your loan. You
      can also deduct any penalty or bonus a financial institution charges you to
      pay off your loan before it is due. Treat the fee, penalty or bonus as prepaid
      interest and deduct it over the remaining original term of your loan.


      For example, if the term of your loan isfive yearsand in the third year you
      pay a fee to reduce your interest rate, treat this fee as a prepaid expense
      and deduct it over the remaining term of the loan. For more information, seePrepaid
      expenses.


      You can deduct certain fees you incur when you get a loan to buy or improve
      your business property. These fees include:


      application, appraisal, processing and insurance feesloan guarantee feesloan
      brokerage and finder''s feeslegal fees related to financing


      You deduct these fees over a period offive years, regardless of the term of
      your loan. Deduct 20% (100% divided byfive yearsequals 20%) in the current tax
      year and 20% in each of the nextfour years. The 20% limit is reduced proportionally
      for fiscal periods of less than12 months.


      If you repay the loan before the end of the five-year period, you can deduct
      the remaining financing fees then. The number of years for which you can deduct
      these fees is not related to the term of your loan.


      If you incur standby charges, guarantee fees, service fees or any other similar
      fees, you may be able to deduct them in full in the year you incur them. For
      more information, seeInterpretationBulletin IT-341, Expenses of Issuing or Selling
      Shares, Units in a Trust, Interests in a Partnership or Syndicate and Expenses
      of Borrowing Money.


      You may be able to deduct interest expenses for a property you used for business
      purposes, even if you have stopped using the property for business activities
      because you are no longer in business. For more information, seeIncome TaxFolio
      S3-F6-C1, Interest Deductibility, orcall1-800-959-5525.


      You can deduct interest you paid on a loan made against an insurance policy,
      as long as the insurer didn''t add the interest you paid to the adjusted cost
      basis of the insurance policy. To claim the interest you paid for 2024, have
      the insurer verify the interest beforeJune 16, 2025,onForm T2210, Verification
      of Policy Loan Interest by the Insurer.


      You can choose to capitalize interest on money you borrow for one of the following
      reasons:


      to buy depreciable propertyto buy a resource propertyfor exploration and development


      When you choose to capitalize interest, add the interest to the cost of the
      property or exploration and development costs instead of deducting the interest
      as an expense.


      The interest related to business use of workspace in your home is atline 9945.'
