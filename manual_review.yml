    title: Fuel costs (except for motor vehicles)
    content: 'You can deduct the cost of fuel used in your business, as well as for
      your fishing boat and equipment, (including gasoline, diesel and propane), motor
      oil and lubricants. For more information about claiming the fuel used in your
      motor vehicle, or if you used a car or truck for your fishing business, seeLine
      9281 –Motor vehicle expenses (not including CCA).


      The cost of fuel related to the business use of workspace in your home has to
      be claimed onLine 9945 –Business-use-of-home expenses.'
