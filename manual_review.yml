    rule_number: 8500
    title: Closing inventory
    content: 'Enter your opening inventory amount at line 8300 and your closing inventory
      amount at line 8500. These amounts must include raw materials, goods in process
      and finished goods. The way you value your inventory is important in determining
      your income. For income tax purposes, choose one of the following two methods:


      value your entire inventory at its fair market value (FMV). Use the price you
      would pay to replace the item or the amount you would get if you sold the item

      value individual items in your inventory at either their FMV or their cost,
      whichever is less. Cost is the price you incur for an item. Cost also includes
      any expenses you incur to bring the item to the business location and put it
      in a condition so that you can use it in the business. When you cannot easily
      tell one item from another, you can value the items as a group


      Once you have chosen a method for valuing your inventory, you have to use that
      method consistently.

      If this is your first year of reporting business income, you can choose either
      method to value your inventory. In your first year of business, you will not
      have an opening inventory amount to enter on line 8300. If this is not your
      first year of business, continue to use the same method you used in past years.
      The value of your inventory at the start of a fiscal period has to be the same
      as the value of your inventory at the end of the preceding fiscal period.

      Do an actual stock count at the end of each fiscal period, unless you use a
      perpetual inventory system. Under this system, you do periodic stock counts
      and keep a written record of each count. Remember to keep your inventory records
      with your other records.

      Businesses that are adventures or concerns in the nature of trade must value
      their inventory at cost.

      For more information about valuing inventory, see Interpretation Bulletin IT-473,
      Inventory Valuation.

      Inventory value of an artistic endeavour

      An artistic endeavour occurs when you are in the business of creating paintings,
      murals, original prints, etchings, drawings, sculptures or similar works of
      art. An artistic endeavour does not include reproducing works of art.

      When you calculate your income from an artistic endeavour, you can elect to
      value your closing inventory at zero. To do this, enter zero at line 8500. Your
      election of zero closing inventory stays in effect for each following year,
      unless you request a change and we allow the change. You cannot use this election
      if you reproduced the works of art.

      For more information, see Income Tax Folio S4-F14-C1, Artists and Writers.

      Gifts of inventory by an artist

      If you donate a work of art you created, you may not have to report a profit
      on your donation for income tax purposes. To benefit from this tax treatment,
      your gift must fall under the definition of gifts of certified cultural property.
      For more information about gifts and donations, see Guide P113, Gifts and Income
      Tax.'
    applies_to: []
