[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qe-tax-rag"
dynamic = ["version"]
description = "Semantic search over Canadian Revenue Agency (CRA) business expense rules"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "QE Tax RAG Contributors"}
]
keywords = ["cra", "rag", "tax", "canada", "semantic-search", "expenses"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlite-vec>=0.1",
    "httpx>=0.25",
    "tqdm>=4.66",
    "numpy>=1.24,<2.0",
    "sentence-transformers>=2.2",
    "torch>=2.1,<2.3",
    "diskcache>=5.6.3",
    "filelock>=3.20.0",
    "pdfplumber>=0.11.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.15.1",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.5",
    "pyfakefs>=5.0",
    "types-PyYAML>=6.0",
    "vcrpy>=6.0",
]
indexing = [
    "sentence-transformers>=2.2",
    "google-generativeai>=0.8.5",
    "pyyaml>=6.0",
    "pdfplumber>=0.10",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "typer>=0.9",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/manonja/qe-tax-rag"
Repository = "https://github.com/manonja/qe-tax-rag"
Documentation = "https://github.com/manonja/qe-tax-rag/docs"
Changelog = "https://github.com/manonja/qe-tax-rag/blob/main/CHANGELOG.md"

[project.scripts]
extract-rules = "qe_tax_rag.extraction.ca.cli:app"
extract-principles = "qe_tax_rag.extraction.ca.principle_cli:app"

[tool.hatch.version]
path = "src/qe_tax_rag/__init__.py"

[tool.hatchling.build.targets.wheel]
packages = ["qe_tax_rag"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src/qe_tax_rag", "tests"]

[tool.ruff.lint]
select = [
    "D",      # pydocstyle
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",  # docstring rules
    "S",      # bandit security
    "B",      # bugbear
    "F403",   # import *
    "ANN",    # annotations
    "G",      # logging format
    "T20",    # print statements
    "PT",     # pytest style
    "SIM",    # simplify
    "ARG",    # unused arguments
    "I",      # isort
    "C90",    # mccabe complexity
    "PD",     # pandas-vet
    "N",      # pep8-naming
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "PLE",    # pylint errors
    "PLR",    # pylint refactor
    "RUF",    # ruff-specific
]
ignore = ["D203", "D212"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "E501", "PLR2004", "S108", "SIM105", "RUF001", "RUF002", "T201", "D104", "S603", "S607"]  # Test files
"tests/fixtures/create_fixture_db.py" = ["T201"]  # CLI script uses print for output
"src/qe_tax_rag/data/validator.py" = ["SIM105"]  # Consistent pattern for sqlite extension loading
"scripts/cli.py" = ["PLR0915", "PLR0913", "C901", "PLR0912"]  # CLI commands naturally have many statements/arguments/branches
"src/qe_tax_rag/extraction/ca/llm_parser.py" = ["E501", "RUF001", "RUF002", "RUF003", "G004", "G201", "C901", "PLR0912", "PLR0915", "PLR2004"]  # Parser function complexity is expected; EN DASH intentional
"src/qe_tax_rag/extraction/ca/classic_parser.py" = ["RUF001", "RUF002", "RUF003", "C901", "G004"]  # EN DASH intentional in pattern matching
"src/qe_tax_rag/extraction/ca/schema.py" = ["RUF001"]  # EN DASH in field descriptions
"src/qe_tax_rag/extraction/ca/settings.py" = ["E501"]  # Long description line
"src/qe_tax_rag/extraction/ca/adjudicator.py" = ["E501", "G004", "G201", "C901", "PLR0913", "PLR2004", "N806", "D301", "D413"]  # Adjudicator complexity and long prompts are intentional
"src/qe_tax_rag/extraction/ca/yaml_generator.py" = ["PLR0915"]  # generate() function complexity is inherent to orchestration
"src/qe_tax_rag/extraction/ca/cli.py" = ["E501"]  # Rich formatting naturally creates longer lines
"src/qe_tax_rag/extraction/ca/orchestrator.py" = ["E501", "G004"]  # Orchestrator logging and formatting
"tests/unit/test_yaml_generator.py" = ["ARG001"]  # pyfakefs fixture auto-use

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Fast unit tests (<100ms each)",
    "integration: Integration tests with I/O",
    "slow: Tests taking >1 second",
]
addopts = "--strict-markers --tb=short"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "build", "dist", ".venv", "venv"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.coverage.run]
source = ["src/qe_tax_rag"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "vcrpy>=7.0.0",
]
