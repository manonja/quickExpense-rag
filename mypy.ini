[mypy]
python_version = 3.12
strict = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True

# Allow untyped imports for third-party libraries without stubs
[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-sqlite_vec.*]
ignore_missing_imports = True

[mypy-pdfplumber.*]
ignore_missing_imports = True
