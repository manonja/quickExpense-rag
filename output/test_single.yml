- rule_number: 8523
  title: Meals and entertainment
  content: 'The maximum amount you can claim for food, beverages and entertainment expenses
    is 50% of the lesser of the following amounts:


    the amount incurred for these expensesan amount that is reasonable in the circumstances


    When you claim expenses on this line, you will have to calculate the allowable part you
    can claim for business use.


    These limits also apply to the cost of your meals when you travel or go to a convention,
    conference, or similar event. Special rules can affect your claim for meals in these cases.
    For more information, seeConvention expenses for business and professional.


    These limits do not apply in any of these cases:


    Your business regularly provides food, beverages or entertainment to customers for compensation
    (for example, a restaurant, hotel or motel)You bill your client or customer for the meal
    and entertainment costs, and you show these costs on the billYou include the amount of
    meal and entertainment expenses in an employee''s income or would include them if the
    employee did not work at a remote or special work location. In addition, the amount cannot
    be paid or payable for a conference, convention, seminar or similar event and the special
    work location must be at least30 kilometresfrom the closest urban centre with a population
    of 40,000 or more; visitStatistics CanadaYou incur meal and entertainment expenses for
    an office party or similar event, and you invite all your employees from a particular
    location. The limit issix suchevents per yearThe meal and entertainment expenses you incur
    are for a fund-raising event that was mainly for the benefit of a registered charityYou
    provide meals to an employee housed at a temporary work camp constructed or installed
    specifically to provide meals and accommodation to employees working at a construction
    site (note that the employee cannot be expected to return home daily)


    Entertainment expenses include tickets and entrance fees to an entertainment or sporting
    event, gratuities, cover charges and room rentals such as hospitality suites.


    For more information, seeInterpretationBulletin IT-518, Food, Beverages and Entertainment
    Expenses.


    Expenses for food and beverages consumed by a long-haul truck driver during an eligible
    travel period are deductible at 80%.


    An eligible travel period is a period of at least24 continuoushours throughout which the
    driver is away from the municipality and metropolitan area that he or she resides and
    is driving a long-haul truck that transports goods to, or from a location that is beyond
    a radius of at least160 kilometresfrom the residential location.


    Self-employed foot and bicycle couriers and rickshaw drivers can deduct the cost of extra
    food and beverages they must consume in a normal working day(eight hours)because of the
    nature of their work. The daily flat rate that can be claimed is $23.


    If you are claiming this deduction you should be prepared to provide logbooks showing
    the days worked and the hours worked on each of these days during the tax year. The Canada
    RevenueAgency (CRA)may also ask for dispatch slips or other documents to support the days
    worked during the tax year.


    If you want to claim more than the flat-rate amount, theCRAwill also need all following
    items:


    supporting receipts for all food and beverages claimeda document that clearly shows the
    extra amount of food and beverages required because of the nature of your work, and how
    this amount exceeds what the average person would consume in terms of both cost and quantity


    Claim the total amount you paid for food you stocked on your boat to feed your crew when
    you fished offshore.


    Often, inshore fishers do not stock food. Instead, they bring meals from home for their
    crew because the trips are short (leave home early in the morning and come back late in
    the afternoon). You can deduct the cost of these meals as long as the meals were a taxable
    benefit to your crew.


    In some cases, you can deduct the cost of meals even though they were not taxable benefits.
    You can do this if your boat was at sea for36 hoursor more and the meals you provided
    for your crew were not taxable benefits. Also, if you gave meals to your sharespeople,
    generally the meals you provided for them are not taxable benefits because we do not consider
    sharespeople to be employees. The 50% rule applies to all self-employed sharespeople.
    However, they may be limited by the restriction noted above.


    For more information about taxable benefits, see theT4130, Employers''Guide –Taxable Benefits
    and Allowances. Also seeInterpretationBulletin IT-91, Employment at Special Work Sites
    or Remote Work Locations.'
