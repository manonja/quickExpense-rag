  title: Custom or contract work (includes machine rentals)
  content: Enter the expenses you incurred for custom and contract work, and machinery rental.
    For example, you may have had a contract with someone who cleaned, sorted, graded and
    sprayed the eggs your hens produced, or someone who had facilities to age the cheese you
    produced. You may have also contracted someone to do your harvesting, combining, crop
    dusting or seed cleaning.
  applies_to: []
  source_citation: Line 9798
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: null
  source_file: t4002-5.html
- rule_number: 9799
  title: Electricity
  content: 'Only the part of your electricity costs that relates to your farming business
    is deductible. To determine the part you can deduct, keep a separate record of the amounts
    that apply to the farmhouse and other farm properties.


    The business part of your electricity expense will depend on how much electricity is used
    for the barns and shops. Because the electricity for the farmhouse is a personal expense,
    you cannot deduct it unless you meet the conditions explained atLine 9945 –Business-use-of-home
    expenses.


    Do not include onForm T2042the electricity expense for a house you rented to someone else.
    This is a rental expense, which you enter onForm T776, Statement of Real Estate Rentals.'
  applies_to: []
  source_citation: Line 9799
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: null
  source_file: t4002-5.html
- rule_number: 9802
  title: Heating fuel and curing fuel
  content: 'Enter the total amount you paid for natural gas, coal and oil to heat farm buildings.
    Enter your expenses for fuel used for curing tobacco, crop drying or greenhouses.


    You can deduct only the part of these costs that relate to your farming business. To determine
    the part you can deduct, keep a separate record of the amounts you paid for the farmhouse
    and other farm properties.


    The business part of your heating fuel expense will depend on how much heating fuel is
    used for the barns and shops. Because the heating fuel for the farmhouse is a personal
    expense, you cannot deduct it unless you meet the conditions explained atLine 9945 –Business-use-of-home
    expenses.


    Do not include the heating fuel expenses for a house you rented to someone else. This
    is a rental expense, which you enter onForm T776.'
  applies_to: []
  source_citation: Line 9802
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: null
  source_file: t4002-5.html
- rule_number: 9803
  title: Insurance program overpayment recapture
  content: Enter the amount of any insurance program overpayment recapture you incurred. You
    should receive anAGR-1 slip, Statement of Farm-Support Payments, identifying the amount
    of the recapture inbox 17.
  applies_to: []
  source_citation: Line 9803
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: null
  source_file: t4002-5.html
- rule_number: 9804
  title: Insurance
  content: 'Enter the amount of business-related insurance premiums you paid to insure your
    farm buildings, farm equipment (excluding machinery and motor vehicles), livestock and
    business interruption.


    In most cases, you cannot deduct your life insurance premiums. However, if you use your
    life insurance policy as collateral for a loan related to your farming business, you may
    be able to deduct a limited part of the premiums you paid. For more information, seeInterpretationBulletin
    IT-309, Premiums on Life Insurance Used as Collateral.


    In most cases, you cannot deduct the amounts you paid to insure personal property such
    as your home or car. However, if you used the personal property for your farming business,
    you can deduct the business part of these costs. For more information, seeLine 9945 –Business-use-of-home
    expensesandLine 9819 –Motor vehicle expenses.'
  applies_to: []
  source_citation: Line 9804
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: null
  source_file: t4002-5.html
- rule_number: 9805
  title: Interest and bank charges
  content: 'You can deduct interest you incurred on money borrowed for farming business purposes
    or to acquire property for farming business purposes. However, there are limits on:


    The interest you can deduct on money you borrowed to buy a passenger vehicle or a zero-emission
    passenger vehicle. For more information, seeLine 9819 –Motor vehicle expensesThe amount
    of interest you can deduct for vacant land. Usually, you can only deduct interest up to
    the amount of income from the land that remains after you deduct all other expenses. You
    cannot use any remaining amounts of interest to create or increase a loss, and you cannot
    deduct them from other sources of income


    You can deduct interest you paid on any real estate mortgage you incurred to earn farming
    income, but you cannot deduct the principal part of loan or mortgage payments. Do not
    deduct interest on money you borrowed for personal purposes or to pay overdue income taxes.


    You may be able to deduct interest expenses for a property you used for farming business
    purposes, even if you have stopped using the property for such purposes because you are
    no longer in the farming business. For more information, seeIncome TaxFolio S3-F6-C1,
    Interest Deductibility, or call1-800-959-5525.'
  applies_to: []
  source_citation: Line 9805
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: null
  source_file: t4002-5.html
- rule_number: 9808
  title: Office expenses
  content: You can deduct the cost of office expenses. These include small items such as pens,
    pencils, paper clips, stationery and stamps. Office expenses do not include items such
    as calculators, filing cabinets, chairs and desks. These are capital items. For more information
    on capital property, seeClass 14.1(5%).
  applies_to: []
  source_citation: Line 9808
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: null
  source_file: t4002-5.html
- rule_number: 9809
  title: Professional fees (includes legal and accounting fees)
  content: 'Deduct the fees you incurred for external professional advice or services, including
    consulting fees.


    You can deduct accounting and legal fees you incur to get advice and help in keeping your
    records. You can also deduct fees you incur for preparing and filing your income tax andGST/HSTreturns.


    You can deduct accounting or legal fees you paid to have an objection or appeal prepared
    against an assessment for income tax,CPPorQPPcontributions, orEIpremiums. However, the
    full amount of these deductible fees must first be reduced by any reimbursement of these
    fees you have received. Report the difference online 23200of your income tax return. If
    you received a reimbursement in 2024 for the types of fees you deducted in a previous
    year, report the amount you received online 13000of your2024 incometax return.


    You cannot deduct legal and other fees you incur to buy capital property. Instead, add
    these fees to the cost of the property. For more information on capital property, seeClass
    14.1(5%).


    For more information, seeInterpretationBulletin IT-99, Legal and Accounting Fees.'
  applies_to: []
  source_citation: Line 9809
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: null
  source_file: t4002-5.html
- rule_number: 9810
  title: Property taxes
  content: 'Enter the amount of land, municipal and realty taxes you paid for property used
    in your farming business. Since the municipal tax for the farmhouse is a personal expense,
    you cannot deduct it unless you meet the conditions explained atLine 9945 –Business-use-of-home
    expenses.


    If you are repaying a loan for land drainage through your property tax payments to your
    township, you cannot include the amount you repaid as part of your property tax expense.'
  applies_to: []
  source_citation: Line 9810
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: null
  source_file: t4002-5.html
- rule_number: 9811
  title: Rent (land, buildings and pasture)
  content: 'You can deduct rent incurred for land, buildings and pasture used in your farming
    business.


    If you farmed on a sharecrop basis and paid your landlord a share of the crop, you can
    dooneof the following:


    Add to your income thefair marketvalue (FMV)of the crops given to your landlord. Deduct
    the same amount as a rent expenseDo not include theFMVin income and do not deduct the
    amount as a rent expense'
  applies_to: []
  source_citation: Line 9811
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: null
  source_file: t4002-5.html
- rule_number: 9814
  title: Salaries, wages and benefits (including employer's contributions)
  content: 'You can deduct employees'' gross salaries and other benefits you incurred. Do
    not deduct salaries or drawings paid or payable to yourself or a partner. For more information,
    seePart 9 –Details of equity.


    As the employer, you must deduct your part ofCPPorQPPcontributions andEIpremiums. You
    can also deduct workers'' compensation amounts payable on employees'' remuneration andPPIPpremiums.
    ThePPIPis an income replacement plan for residents of Quebec. For details, contactRevenu
    Québec. For more information on making payroll deductions, gotoPayroll.


    You can also deduct any insurance premiums you pay for an employee for a sickness, an
    accident, a disability or an income insurance plan.


    You can deduct the salary you pay to your child, as long as you meetallthese conditions:


    you pay the salarythe work your child does is necessary for earning farming incomethe
    salary is reasonable when you consider your child''s age, and the amount you pay is what
    you would pay someone else


    Keep documents to support the salary you pay your child. If you pay your child by cheque,
    keep the cancelled cheque. If you pay cash, have the child sign a receipt.


    Instead of cash, you may pay your child with a product from your business. When you do
    this, claim the value of the product as an expense and add to your gross sales an amount
    equal to the value of the product. Your child has to include the value of the product
    in his or her income.


    You can also deduct the salary you pay to your spouse or common-law partner by using the
    same rules that apply to paying your child.


    Report the salaries you pay to your children and spouse or common-law partner onT4 slips,
    the same as you would for other employees. However, you cannot claim the value of board
    and lodging you provide to your dependent children and spouse or common-law partner as
    an expense.


    For more information, seeGuide RC4120, Employers''Guide –Filing theT4 Slipand Summary.'
  applies_to: []
  source_citation: Line 9814
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: null
  source_file: t4002-5.html
- rule_number: 9819
  title: Motor vehicle expenses (not including CCA)
  content: You can deduct expenses you incur to run a motor vehicle you use to earn farming
    income. Fill in "Chart A –Motor vehicle expenses" ofForm T2042. The chart will help you
    calculate the amount of motor vehicle expenses you can deduct. If you are a member of
    a business partnership and you incur motor vehicle expenses for the business through the
    use of your personal vehicle, you can claim those business related expenses onLine 9943
    –Other amounts deductible from your share of net partnership income (loss)ofForm T2042.
  applies_to: []
  source_citation: Line 9819
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: null
  source_file: t4002-5.html
- rule_number: 9820
  title: Small tools
  content: 'If a tool costs you less than $500, you can deduct its full cost. If it costs
    you $500 or more, add the cost to yourCCAschedule asClass 8property.


    Small tools that cost less than $500 are fully deductible in the year you buy them. You
    may claim them as an expense atline 9820or claimCCAby including them inClass 12(with aCCArate
    of 100%). Either method is acceptable, but do not claim the amount twice. For more information
    onCCA,seeChapter 4.'
  applies_to: []
  source_citation: Line 9820
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: null
  source_file: t4002-5.html
- rule_number: 9898
  title: Total farm expenses
  content: Enter the total oflines 9790and 9936. Enter the business part only.
  applies_to:
  - farming
