- rule_number: 9060
  title: Salaries, wages and benefits (including employer's contributions)
  content: 'You can deduct employees'' gross salaries and other benefits you incurred. For
    more information, go toFishers and employment insurance. Do not deduct salaries or drawings
    paid or payable to yourself or to a partner. For more information, seePart 9 –Details
    of equity.


    TheCPPis for all workers, including the self-employed. Employers, employees and most self-employed
    individuals have to contribute to theCPP. TheCPPcan provide basic benefits when you retire
    or if you become disabled. When you die, theCPPcan provide benefits to your surviving
    spouse or common-law partner and your dependent children under the age of 25.


    Quebec workers including the self-employed are covered under theQPP.


    As the employer, you must deduct your part ofCPPorQPPcontributions and employment insurance
    premiums. You can also deduct workers'' compensation amounts payable on employees'' remuneration
    and Provincial Parental InsurancePlan (PPIP)premiums. ThePPIPis an income replacement
    plan for residents of Quebec. For details, contactRevenu Québec. For more information
    on making payroll deductions, go toPayroll.


    You can also deduct any insurance premiums you pay for an employee for a sickness, an
    accident, a disability or an income insurance plan and deduct the salary you pay to your
    child, as long as you meetallthese conditions:


    you pay the salarythe work your child does is necessary for earning business, professional
    or fishing incomethe salary is reasonable when you consider your child''s age, and the
    amount you pay is what you would pay someone else


    Keep documents to support the salary you pay your child. If you pay your child by cheque,
    keep the cancelled cheque. If you pay cash, have the child sign a receipt.


    Instead of cash, you can pay your child with a product from your business. When you do
    this, claim the value of the product as an expense and add to your gross sales an amount
    equal to the value of the product. Your child has to include the value of the product
    in his or her income.


    You can also deduct the salary you pay to your spouse or common-law partner. When you
    pay your spouse or common-law partner a salary, use the same rules that apply to paying
    your child.


    Report the salaries you pay to your children and spouse or common-law partner onT4 slips,
    the same as you would for other employees. You cannot claim as an expense the value of
    board and lodging you provide to your dependent children and your spouse or common-law
    partner.


    For more information, seeGuide RC4120, Employers''Guide –Filing theT4 Slipand Summary.'
