- rule_number: 9946
  title: Your net income (loss)
  content: 'Enter your net income or loss on this line of your form. Enter it also on the
    appropriate lines of your return:


    line 13500, Business incomeline 13700, Professional incomeline 13900, Commission incomeline
    14100, Farming incomeline 14300, Fishing income


    If you have a loss, enter the amount in brackets. For more information about losses,seeChapter
    5.'
  applies_to: []
  source_citation: Line 9946
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
