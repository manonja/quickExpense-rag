- rule_number: 8690
  title: Insurance
  content: 'You can deduct commercial insurance premiums that you pay for insurance on any
    buildings, machinery and equipment you use in your business.


    Motor vehicle insurance costs are listed atline 9281.


    The insurance costs related to business use of workspace in your home have to be claimed
    online 9945.


    In most cases, you cannot deduct your life insurance premiums. If you use your life insurance
    policy as collateral for a loan related to your business, including fishing business,
    you might be able to deduct a limited part of the premiums you paid. For more information,
    seeInterpretationBulletin IT-309, Premiums on Life Insurance Used as Collateral.


    Enter the premiums you paid to insure your fishing boat and equipment.


    In most cases, you cannot deduct the amounts you paid to insure personal property such
    as your home or car. However, if you used the property for personal use and for your fishing
    business, you can deduct the business part of these costs. For more information, seeLine
    9281 –Motor vehicle expenses (not including CCA)andLine 9945 –Business-use-of-home expenses.'
  applies_to:
