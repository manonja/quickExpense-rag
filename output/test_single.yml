- rule_number: 9796
  title: Clearing, levelling and draining land
  content: 'Enter the total of the expenses listed below. In most cases, you can deduct the
    costs for:


    clearing the land of brush, trees, roots and stonesfirst plowing of the land for farm
    usebuilding an unpaved roadinstalling land drainage


    You do not have to deduct all of the costs in the year you paid them. If you paid all
    of the costs, you can deduct any part of them in the year you paid them. You can carry
    forward any part of the costs you did not deduct to another year. However, if you rented
    land to someone else, you cannot deduct the costs mentioned above. Instead, you may be
    able to do one of the following:


    add these costs to the cost of the landadd these costs to the cost of the building if
    you plan to build on the land right awayinclude these costs underClass 8in theCCAcharts
    onForm T776, Statement of Real Estate Rentals, if you installed a tile, plastic or concrete
    land drainage system. In this case, you also need to add the costs for a tile, plastic
    or concrete land drainage system toClass 8on yourCCAcharts onForm T2042. For more information,seeChapter
    4


    For more information, seeInterpretationBulletin IT-485, Cost of Clearing or Levelling
    Land.


    You cannot deduct the cost of a paved road. Instead, you have to add this cost toClass
    17of yourCCAcharts onForm T2042. For more information,seeChapter 4.


    You can deduct most of the cost to drill or dig water wells in the year you did the work.
    However, you have to add some of the costs toClass 8on yourCCAcharts. The costs you add
    toClass 8are those you incurred to purchase and install:


    the casing and cribwork for the wellthe system that distributes water, including the pump
    and pipes


    You can deduct amounts you paid to have public utilities brought to your farm, as long
    as the installations remain the property of the utility.


    You can deduct amounts you paid under theCanada Cooperatives Actto build a distribution
    system under a gas service contract.'
  applies_to: []
