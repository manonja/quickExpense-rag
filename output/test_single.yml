- rule_number: 8811
  title: Office stationery and supplies
  content: 'You can deduct the cost of items the business used to provide goods or services,
    for example, drugs and medication used by a veterinarian or cleaning supplies used by
    a plumber. If you run a daycare, these include household supplies that children use and
    food you buy to feed the children.


    These expenses are generally related to the workspace. For more information on whether
    an expense is related to your workspace, seeIncome TaxFolio S4-F2-C2, Business Use of
    Home Expenses.'
  applies_to:
