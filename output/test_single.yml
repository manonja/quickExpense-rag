- rule_number: 9941
  title: Optional inventory adjustment included in the current year
  content: 'If you want to include an inventory amount in income, read this section.


    By making theOIA, you can include in your income an amount up to theFMVof your inventory
    minus theMIA. You can only make theOIAif you use the cash method. For the meaning of inventory
    andFMV, seeLine 9942 –Mandatory inventory adjustment included in the current year.


    For theOIA, unlike for theMIA, the inventory doesnothave to be purchased inventory. It
    is the entire inventory you still have at the end of your2024 fiscalperiod.


    Enter the amount of yourOIAonline 9941. You must deduct this amount as an expense in your
    next fiscal period.'
  applies_to: []
  source_citation: Line 9941
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: Inventory adjustments included in 2024 for farmers
  source_file: t4002-5.html
- rule_number: 9942
  title: Mandatory inventory adjustment included in the current year
  content: 'TheMIAdecreases your net loss if you held inventory at the end of your fiscal
    period. Read this section, even if you do not have to make theMIA. This section will show
    you how to determine the value of the farm inventory you bought and still have at the
    end of your2024 fiscalperiod. You will need to know this value if you have to make theMIAthis
    year or in the future.


    You have to make theMIAifallof the following apply:


    You use the cash method to report your incomeYou have a net loss online 9899ofForm T2042You
    bought inventory and still have it at the end of your2024 fiscalperiod. This does not
    refer only to inventory you bought in 2024. It includes inventory you had previously bought
    and still owned at the end of your2024 fiscalperiod


    YourMIAis thelesserof these amounts:


    the net loss before adjustments online 9899the value of the purchased inventory you still
    have at the end of your2024 fiscalperiod


    To calculate yourMIA, fill incharts 1, 2, 3 and 4. Once you have completedchart 4, enter
    the amount online 9942. For more information, seeInterpretationBulletin IT-526,Farming
    –Cash method inventory adjustments.


    In your next fiscal period, deduct theMIAyou added to your net loss in your2024 fiscalperiod.'
  applies_to: []
  source_citation: Line 9942
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: Inventory adjustments included in 2024 for farmers
  source_file: t4002-5.html
- rule_number: 9943
  title: Other amounts deductible from your share of net partnership income (loss)
  content: 'If you are a member of a partnership and you incur motor vehicle expenses for
    the business using your personal vehicle, you can claim those expenses on this line. The
    expenses must not have been claimed anywhere else on the form.


    Claim this amount only if the partnership did not repay you for these expenses. The limits
    discussed earlier in this chapter also apply to these expenses.


    Fill in the "Other amounts deductible from your share of net partnership income (loss)"
    chart of your form. List the other amounts you can deduct from your share of the partnership''s
    net income or loss.'
  applies_to: []
  source_citation: Line 9943
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: Part 5 –Your net income (loss)
  source_file: t4002-5.html
- rule_number: 9945
  title: Business-use-of-home expenses
  content: 'You can deduct expenses for the business use of a workspace in your home, if you
    meetoneof the following conditions:


    it is your principal place of businessyou use the space only to earn your business income,
    and you use it on a regular and ongoing basis to meet your clients, customers or patients


    You can deduct part of your maintenance costs such as heating, home insurance, electricity
    and cleaning materials. You can also deduct part of your property taxes, mortgage interest
    andCCA. To calculate the part you can deduct, use a reasonable basis, such as the area
    of the workspace divided by the total area of your home.


    If you use part of your home for both your business and personal living, calculate how
    many hours in the day you use the rooms for your business, and then divide that amount
    by24 hours. Multiply the result by the business part of your total home expenses. This
    will give you the household cost you can deduct. If you run the business for only part
    of the week or year, reduce your claim accordingly.


    For more information, seeIncome TaxFolio S4-F2-C2, Business Use of Home Expenses.'
  applies_to: []
  source_citation: Line 9945
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: Part 5 –Your net income (loss)
