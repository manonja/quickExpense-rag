- rule_number: 9931
  title: Total business liabilities
  content: 'A liability is a debt or an obligation of a business. Total business liabilities
    are the total of all amounts your business owes at the end of its fiscal period.


    Total business liabilities include:


    accounts payablenotes payableincome taxes and taxes payableunpaid salaries, wages and
    benefitsinterest payabledeferred or unearned revenuesloans payablemortgages payableany
    other outstanding balance related to the business'
  applies_to: []
  source_citation: Line 9931
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: Part 9 –Details of equity
  source_file: t4002-5.html
- rule_number: 9932
  title: Drawings in the current year
  content: A drawing is any withdrawal of cash (including salaries) or other assets, or services
    of a business by the proprietor or partners. This includes transactions by the proprietor
    or partners (or family members), like withdrawing cash for non-business use and using
    business assets and services for personal use. Include the cost or value of the personal
    use of business assets or services in your drawings for the year.
  applies_to: []
  source_citation: Line 9932
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: Part 9 –Details of equity
  source_file: t4002-5.html
- rule_number: 9933
  title: Capital contributions in the current year
  content: A capital contribution is cash or other assets you added to the business during
    its fiscal period. This includes personal funds you added to the business account, business
    debts you paid with personal funds, and personal assets you transferred to the business.
  applies_to: []
  source_citation: Line 9933
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: Part 9 –Details of equity
  source_file: t4002-5.html
- rule_number: 9936
  title: Capital costallowance (CCA)
  content: If you use a property you own such as a building, a motor vehicle, furniture or
    equipment in your business, you might be able to claimCCA. Enter the amount ofCCAyou calculated
    on the charts found on your form. For more information on how to fill in these charts,seeChapter
    4.
  applies_to: []
  source_citation: Line 9936
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: null
  source_file: t4002-5.html
- rule_number: 9937
  title: Mandatory inventory adjustment included in the previous year
  content: 'If you included an amount for the mandatory inventoryadjustment (MIA)online 9942in
    your2023 fiscalperiod, deduct the amount as an expense in your2024 fiscalperiod. Do not
    include the valuation of inventories if you are using the accrual method of accounting.
    For more information about the accrual method, seeReporting methods.


    For more information onMIA, seeLine 9942 –Mandatory inventory adjustment included in the
    current year.'
  applies_to: []
  source_citation: Line 9937
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
    Chapter 3 – Expenses'
  section: null
  source_file: t4002-5.html
- rule_number: 9938
  title: Optional inventory adjustment included in the previous year
  content: 'If you included an amount for the optional inventoryadjustment (OIA)online 9941in
    your2023 fiscalperiod, deduct the amount as an expense in your2024 fiscalperiod. Do not
    include the valuation of inventories if you are using the accrual method of accounting.
    For more information about the accrual method, seeReporting methods.


    For more information onOIA, seeLine 9941 –Optional inventory adjustment included in the
    current year.'
  applies_to: []
  source_citation: Line 9938
  chapter: 'Self-employed Business, Professional, Commission, Farming, and Fishing Income:
