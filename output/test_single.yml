- rule_number: 9200
  title: Travel expenses
  content: 'You can deduct travel expenses you incur to earn business and professional income.
    Travel expenses include public transportation fares, hotel accommodation and meals. If
    you run a daycare, you can also deduct on this line the cost of tickets you may have bought
    for field trips.


    In most cases, the50% limitapplies to the cost of meals, beverages and entertainment when
    you travel. We discuss this limit inLine 8523 –Meals and entertainment.'
