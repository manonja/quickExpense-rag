- rule_number: 8860
  title: Professional fees (includes legal and accounting fees)
  content: 'You can deduct the fees you incurred for external professional advice, services
    and consulting fees.


    You can deduct accounting and legal fees for advice and help with keeping your records.
    You can also deduct expenses for preparing and filing your income tax andGST/HSTreturns.


    You can deduct accounting or legal fees you paid to have an objection or appeal prepared
    against an assessment for income tax, Canada PensionPlan (CPP)or Quebec PensionPlan (QPP)contributions,
    or employmentinsurance (EI)premiums. However, the full amount of these deductible fees
    must first be reduced by any reimbursement of these fees that you have received. Report
    the difference online 23200of your tax return. If you received a refund in 2024 for the
    types of fees that you deducted in a previous year, report the amount you received atline
    13000of your2024 taxreturn.


    You cannot deduct legal expenses and other fees you incur to buy a capital property, such
    as a boat or fishing material. Instead, add these fees to the cost of the property. For
    more information on capital property, seeClass 14.1 (5%).


    For more information, seeInterpretationBulletin IT-99, Legal and Accounting Fees.'
