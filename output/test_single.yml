- rule_number: 9281
  title: Motor vehicle expenses (not including CCA)
  content: 'You can deduct expenses you incur to run a motor vehicle you use to earn business
    or fishing income. Fill in "Chart A –Motor vehicle expenses" on your form. The chart will
    help you calculate the amount of motor vehicle expenses you can deduct. If you are a member
    of a partnership and you incur motor vehicle expenses for the business through the use
    of your personal vehicle, you can claim those expenses related to the business online
    9943inPart 5.


    If you use your vehicleoccasionallyfor business purposes, you can claim motor vehicle
    expenses on a per-trip basis. For example, if you are operating a daycare business, taking
    the children to a park or on an excursion may involve paying for fuel and parking.


    If youregularlyuse your vehicle for business and personal trips, you can claim part of
    the total operating expenses for your vehicle as a business expense. You must keep accurate
    records that show the part of the total kilometres that you drove for your business.'
