- rule_number: 9974
  title: GST/HST rebate for partners received in the year
  content: 'If you received aGST/HSTrebate for partners, report the amount of the rebate that
    relates to eligible expenses other thanCCAonline 9974of your form in the year you receive
    the rebate.


    For business and professional income, enter the total ofamount 5A,amount 5Bandline 9974atamount
    5C.


    For farming income, enter the total ofamount 5A,line 9951andline 9974atamount 5B.


    For fishing income, enter the total ofamount 5Aandline 9974atamount 5B.'
  applies_to: []
