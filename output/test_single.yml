- rule_number: 9951
  title: Return of fuel charge proceeds to farmers tax credit allocated to you in the year
  content: This credit is considered to be government assistance that you received in the
    year and is taxable to you. Include in your income the amount of the credit allocated
    to you by the partnership (amount 5Cof yourForm T2043) in the same tax year in which you
    claimed the credit.
  applies_to: []
