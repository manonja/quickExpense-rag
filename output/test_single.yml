- rule_number: 9795
  title: Building repairs and maintenance (includes fence repairs)
  content: 'Deduct repairs to fences and all buildings you used for farming, except your farmhouse.
    Do not include the value of your own labour. If the expenditure improved a fence or building
    beyond its original condition, the costs are capital expenditures. Add the expenditure
    to the cost of the asset on yourCCAcharts onForm T2042.CCAcharts are explained inChapter
    4.


    For more information on capital expenditures, seeIncome TaxFolio S3-F4-C1, General Discussion
    of Capital Cost Allowance.


    If you used your farmhouse for business reasons, seeLine 9945 –Business-use-of-home expenses.'
  applies_to: []
