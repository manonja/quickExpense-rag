rules:
- rule_number: 8521
  title: Advertising
  content: 'You can deduct expenses for advertising, including advertising in Canadian newspapers
    and on Canadian television and radio stations. You can also include any amount you paid
    as a finder''s fee.


    To claim the expenses, you must meet certain Canadian content or Canadian ownership requirements.
    These requirements do not apply if you advertise on foreign websites.


    Restrictions apply to the amount of the expense you can deduct for advertising in a periodical.
    You can deduct all the expense if your advertising is directed at a Canadian market and
    the original editorial content in the issue is 80% or more of the issue''s total non-advertising
    content.


    You can deduct 50% of the expense if your advertising in a periodical is directed at a
    Canadian market and the original editorial content in the issue is less than 80% of the
    issue''s total non-advertising content.


    You cannot deduct expenses for advertising directed mainly at a Canadian market when you
    advertise with a foreign broadcaster.'
  applies_to:
