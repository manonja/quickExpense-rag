- rule_number: 8760
  title: Business taxes, licences and memberships
  content: 'You can deduct all annual licence fees and some business taxes you incur to run
    your business. Some examples of licence fees are: beverage licenses; business charges;
    trade licences; motor vehicle licenses; and motor vehicle registration permits. Some examples
    of business taxes that may be deductible are: municipal taxes; land transfer taxes; gross
    receipt tax; health and education tax; and hospital tax.


    You can also deduct annual dues or fees to keep your membership in a trade or commercial
    association, as well as subscriptions to publications. You cannot deduct club membership
    dues (including initiation fees) if the main purpose of the club is dining, recreation
    or sporting activities.


    Enter the total cost to renew your annual licences. If you bought a licence from another
    fisher, you can only deduct part of the cost each year. For details on depreciable property,
    seeChapter 4.


    If you bought a fishing boat and the price included the cost of a licence, you need to
    know what part of the price was for the licence and what part was for the boat. Try to
    agree on these amounts with the seller. See the exampleTax treatment for fishing equipment.'
