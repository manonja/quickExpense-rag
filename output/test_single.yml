- rule_number: 8810
  title: Office expenses
  content: 'You can deduct the cost of office expenses that are generallynotrelated to your
    workspace. These include small items such as pens, pencils, paper clips, stationery and
    stamps. For office expenses related to your workspace, seeLine 8811 –Office stationery
    and suppliesbelow.


    Office expenses do not include capital expenditures to acquire capital property such as
    calculators, filing cabinets, chairs and a desk. These are capital items.'
